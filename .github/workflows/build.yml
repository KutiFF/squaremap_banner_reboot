
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Prepare distributable JAR
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob

          jars=(build/libs/*.jar)
          distributable=()

          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-dev*.jar)
                continue
                ;;
              *)
                distributable+=("$jar")
                ;;
            esac
          done

          if [[ "${#distributable[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one distributable JAR."
            printf '%s\n' "${distributable[@]}"
            exit 1
          fi

          cp "${distributable[0]}" dist/
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: squaremap-banner-reboot-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
